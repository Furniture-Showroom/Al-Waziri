<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لا يوجد اتصال بالإنترنت | معرض الحاج حماده نافع وزيري للأثاث</title>
<meta name="theme-color" content="#061A2F">
<link rel="icon" href="./assets/icons/favicon-32.png" sizes="32x32">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#061A2F; --gold:#D9A62E; --cream:#F5E7C1; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--navy); color: var(--cream); font-family: 'Cairo', Tahoma, Arial, sans-serif;
    text-align: center; padding: 2rem;
  }
  .wrap { max-width: 380px; }
  img { width: 88px; height: 88px; border-radius: 50%; margin-bottom: 1.5rem; }
  h1 { font-size: 1.25rem; margin: 0 0 0.75rem; }
  p { color: #B9C2CE; font-size: 0.95rem; line-height: 1.7; margin: 0 0 1.5rem; }
  button {
    background: linear-gradient(180deg, #F4CC63, var(--gold)); color: #03070C; border: none;
    padding: 0.85rem 1.8rem; border-radius: 999px; font-weight: 700; font-size: 0.95rem; cursor: pointer;
    font-family: inherit;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img src="./assets/icons/icon-192.png" alt="" width="88" height="88">
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>تعذر تحميل هذه الصفحة لعدم توفر اتصال بالإنترنت حاليًا. تحقق من الاتصال ثم أعد المحاولة.</p>
    <button type="button" onclick="location.reload()">إعادة المحاولة</button>
  </div>
</body>
</html>
